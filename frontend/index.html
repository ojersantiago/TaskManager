<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Task Manager</h1>
    <button id="logout-btn" class="btn-logout">Cerrar sesión</button>
  </header>

  <main>
    <div class="task-form-container">
      <h2 id="form-title">Nueva tarea</h2>
      <div class="form-group">
        <label for="title">Título</label>
        <input type="text" id="title" placeholder="Título de la tarea">
      </div>
      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea id="description" placeholder="Descripción (opcional)"></textarea>
      </div>
      <div class="form-group">
        <label for="due-date">Fecha límite</label>
        <input type="date" id="due-date">
      </div>
      <div class="form-buttons">
        <button id="save-btn" class="btn-primary">Guardar tarea</button>
        <button id="cancel-btn" class="btn-secondary hidden">Cancelar</button>
      </div>
    </div>

    <div class="tasks-container">
      <div class="tasks-header">
        <h2>Mis tareas</h2>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="pending">Pendientes</button>
          <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>
      </div>
      <div id="tasks-list"></div>
    </div>
  </main>

  <script src="js/tasks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
